name: Compilar APK Cerrado
on:
  push:
    branches: [ "**" ]
  workflow_dispatch:
jobs:
  build:
    name: Build Closed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Configurar Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Compilar APK
        run: gradle assembleDebug --stacktrace
      - name: Renombrar y guardar APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/X-Message-Adapter-v2.8-Cerrado.apk
      - name: Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: X-Message-Adapter-v2.8-Cerrado-APK
          path: output/X-Message-Adapter-v2.8-Cerrado.apk
          retention-days: 30
